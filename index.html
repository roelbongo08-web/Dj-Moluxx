<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Moluxx</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f6f9;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            max-width: 500px;
            width: 90%;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-8px);
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-content {
            padding: 25px;
        }
        .card-title {
            font-size: 24px;
            font-weight: bold;
            color: #111;
            margin-bottom: 20px;
        }
        .btn-visit {
            display: inline-block;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease;
        }
        .btn-visit:hover {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Image display -->
        <img src="unnamed.PNG" alt="DJ Moluxx">
        
        <div class="card-content">
            <div class="card-title">DJ Moluxx</div>
            <!-- Clickable Link Button -->
            <a href="https://tinyurl.com/Dj-Moluxx" class="btn-visit" target="_blank">
                Click to visit DJ Moluxx's Website
            </a>
        </div>
    </div>

</body>
</html>
